<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Offline settings — real pudding row model</title>
  <style>
    html, body { margin: 0; height: 100%; background: #202124; color: #fff; font-family: Arial, sans-serif; }
    .wjOYOd {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center;
    }
    .wjOYOd > div { background: #303134; padding: 20px; border-radius: 8px; min-width: 360px; }
    .setting-row { display: flex; gap: 6px; margin: 10px 0; align-items: center; }
    .setting-row .opt {
      flex: 1; padding: 8px 6px; background: #3c4043; border: 1px solid #5f6368;
      color: #fff; cursor: pointer; text-align: center; font-size: 12px;
    }
    .setting-row .opt.tuJOWd { background: #8ab4f8; color: #202124; border-color: #8ab4f8; }
    #play-button { margin-top: 12px; padding: 10px 18px; cursor: pointer; }
    #game-canvas { position: absolute; left: 8px; top: 8px; width: 120px; height: 90px; background: #333; }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="120" height="90"></canvas>
  <div class="wjOYOd" id="death-overlay">
    <div>
      <div>Native settings (offline)</div>
      <div class="setting-row" id="trophy"></div>
      <div class="setting-row" id="count"></div>
      <div class="setting-row" id="speed"></div>
      <div class="setting-row" id="size"></div>
      <div class="setting-row" id="theme"></div>
      <button type="button" id="play-button" aria-label="Play" jsname="NSjDf">Play</button>
    </div>
  </div>
  <script>
    (function () {
      /**
       * Faithful-enough pudding/Google setting model:
       * - rows #trophy/#count/… with option children
       * - selected option has class tuJOWd (what Gsm.readSettingIndex looks for)
       * - puddingMenuSelect(id, idx) updates selection ONLY when menus are live
       * - menus are live when death overlay is visible AND engine is not mid-run
       */
      const LABELS = {
        trophy: ["Classic", "Wall", "Portal", "Cheese"],
        count: ["1", "3", "5", "10"],
        speed: ["Normal", "Fast", "Slow"],
        size: ["Standard", "Small", "Large"],
        theme: ["Default", "Blue", "Dark", "Light"],
      };
      window.pudding_settings = { SavedGameSettings: {} };
      window.__settingsStore = {};

      function menusAcceptInput() {
        const overlay = document.querySelector(".wjOYOd");
        if (!overlay) return false;
        const cs = getComputedStyle(overlay);
        if (cs.visibility === "hidden" || cs.display === "none") return false;
        if (parseFloat(cs.opacity) === 0) return false;
        if (cs.pointerEvents === "none") return false;
        if (window.__mpGame && !window.__mpGame.nj) return false;
        if (window.timeKeeper && window.timeKeeper._dead === false && window.pauseGame === 0) {
          // Live run: Google ignores setting clicks
          if (window.__mpGame && window.__mpGame.nj === false) return false;
        }
        return !(window.__mpGame && window.__mpGame.nj === false);
      }

      function paintRow(id, idx) {
        const row = document.getElementById(id);
        const labels = LABELS[id] || ["0", "1", "2"];
        const n = ((idx % labels.length) + labels.length) % labels.length;
        row.innerHTML = "";
        labels.forEach(function (label, i) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "opt" + (i === n ? " tuJOWd" : "");
          btn.textContent = label;
          btn.dataset.index = String(i);
          btn.addEventListener("click", function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
            window.puddingMenuSelect(id, i);
          });
          row.appendChild(btn);
        });
        window.__settingsStore[id] = n;
        window.pudding_settings.SavedGameSettings[id] = n;
      }

      window.puddingMenuSelect = function (id, index) {
        if (!LABELS[id]) return false;
        if (!menusAcceptInput()) {
          window.__menuBlockedHits = (window.__menuBlockedHits | 0) + 1;
          return false;
        }
        const labels = LABELS[id];
        const n = Number(index);
        if (!Number.isFinite(n) || n < 0 || n >= labels.length) return false;
        paintRow(id, n);
        window.__menuChanges = window.__menuChanges || [];
        window.__menuChanges.push({ id: id, index: n, t: Date.now() });
        if (id === "trophy") window.CurrentModeNum = n;
        return true;
      };

      Object.keys(LABELS).forEach(function (id) {
        paintRow(id, 0);
      });
      window.CurrentModeNum = 0;

      window.__mpGame = {
        nj: true,
        dead: true,
        oa: {
          ka: [{ x: 5, y: 5, clone: function () { return { x: this.x, y: this.y }; } }],
          direction: "RIGHT",
        },
        Ca: { Aa: new Map(), wa: [] },
        wa: { ka: [] },
        reset: function () {
          // In-game Reset — harmful for menu unlock (leaves a live-ish run)
          this.nj = false;
          this.dead = false;
          window.timeKeeper._dead = false;
          window.timeKeeper.playing = true;
          window.pauseGame = 0;
          const overlay = document.querySelector(".wjOYOd");
          if (overlay) {
            overlay.style.visibility = "hidden";
            overlay.style.opacity = "0";
          }
        },
        die: function () {
          this.nj = true;
          this.dead = true;
        },
      };
      window.__remixGame = window.__mpGame;
      window.timeKeeper = {
        _dead: true,
        playing: false,
        getCurrentSetting: function (id) {
          return window.__settingsStore[id] != null ? window.__settingsStore[id] : 0;
        },
        start: function () {
          this._dead = false;
          this.playing = true;
        },
      };
      window.pauseGame = 1;

      document.getElementById("play-button").addEventListener("click", function () {
        const overlay = document.querySelector(".wjOYOd");
        overlay.style.visibility = "hidden";
        overlay.style.opacity = "0";
        window.__mpGame.nj = false;
        window.__mpGame.dead = false;
        window.timeKeeper._dead = false;
        window.timeKeeper.playing = true;
        window.pauseGame = 0;
        window.__playClicked = (window.__playClicked | 0) + 1;
      });

      window.__readAllSettings = function () {
        const Gsm = window.MultiplayerGsm;
        const out = {};
        Object.keys(LABELS).forEach(function (id) {
          out[id] =
            Gsm && typeof Gsm.readSettingIndex === "function"
              ? Gsm.readSettingIndex(id)
              : window.timeKeeper.getCurrentSetting(id);
        });
        return out;
      };

      window.__fixtureProbe = function () {
        const overlay = document.querySelector(".wjOYOd");
        const cs = overlay && getComputedStyle(overlay);
        return {
          overlayVis: cs && cs.visibility,
          overlayOp: cs && cs.opacity,
          overlayPe: cs && cs.pointerEvents,
          gameNj: !!(window.__mpGame && window.__mpGame.nj),
          playClicked: window.__playClicked | 0,
          blockedHits: window.__menuBlockedHits | 0,
          changes: (window.__menuChanges || []).slice(),
          settings: window.__readAllSettings(),
          menusOpen: menusAcceptInput(),
        };
      };
    })();
  </script>
</body>
</html>
